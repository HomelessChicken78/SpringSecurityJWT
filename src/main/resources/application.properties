spring.application.name=SpringSecurityJWT
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${USERNAME_DB}
spring.datasource.password=${PASSWORD_DB}
spring.jpa.hibernate.ddl-auto=update
server.servlet.context-path=/api

# Sicurezza
security.jwt.secret-key=${JWT_KEY}
# 8 ore in millisecondi:
security.jwt.expiration=28800000

# Creazione dell'admin
initial-data.admin.username=${ADMIN_USERNAME}
initial-data.admin.password=${ADMIN_PASSWORD}